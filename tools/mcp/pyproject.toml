[project]
name = "anomaly-mcp"
version = "0.1.0"
description = "MCP bridge to the TCP endpoint of a running S.T.A.L.K.E.R. Anomaly (X-Ray Monolith MT) engine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "psutil>=5.9",
]

[project.scripts]
anomaly-mcp = "anomaly_mcp.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anomaly_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
